# Select this mode at startup. It publishes catalog.yml and keeps gameplay unavailable.
native-catalog:
  enabled: false
  java-pack:
    # Enable only on a direct Java-only server with no bridge or proxy, including a remote one.
    direct-java-only: false
    # Host the exact bundled infernolantern-generic-java.zip archive over HTTPS.
    url: ""

# Disposable rendering fixtures.
prototype:
  enabled: false
  # Experimental shared vertical calibration; client parity still requires live tests.
  visual-y-offset: 0.0
  # Separate disposable native-zombie experiment; never production defence policy.
  combat-experiment:
    enabled: false
  # Disposable item lifecycle fixtures; both this gate and prototype.enabled are required.
  # Existing tokens stay protected after creation is disabled. No production awards.
  item-lifecycle:
    enabled: false
    survives-fire-lava: true
    despawns: true
