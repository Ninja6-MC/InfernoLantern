name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the built commit and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Build, test and verify the packaged snapshot
        run: ./gradlew --no-daemon clean build
      - name: Record the exact built source and artifact digest
        run: |
          git rev-parse HEAD
          python3 scripts/build_version.py
          sha256sum build/libs/*.jar
      - name: Retain the verified snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: InfernoLantern-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
